name: Generate composer.lock (PHP 7.4)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  gen-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, xml

      - name: Install composer
        run: |
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Install required system deps (zip, git)
        run: sudo apt-get update -y && sudo apt-get install -y zip git unzip

      - name: Ensure composer plugins allowed
        run: |
          composer config --no-plugins allow-plugins.cweagans/composer-patches true || true

      - name: Update lock for composer-patches only
        run: |
          set -e
          # Update only the composer-patches plugin to ensure it is present in lock
          composer update cweagans/composer-patches --no-interaction --no-scripts || composer update --no-interaction --no-scripts

      - name: Show lock status
        run: |
          echo "composer.lock generated:"
          ls -l composer.lock || true
          git --no-pager diff --name-only || true

      - name: Commit composer.lock back to branch (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain composer.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "chore(ci): generate composer.lock on PHP 7.4 for PR ${GITHUB_REF##*/}" || echo "no commit"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "composer.lock unchanged"
          fi

      - name: Upload composer.lock as artifact
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock-php74
          path: composer.lock
